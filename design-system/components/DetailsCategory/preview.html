<!-- @dsCard group="Details" height=232 subtitle="Collapsible category headers and the name / value / reset property row grid" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DetailsCategory</title>
<style>
	/* Every metric below is cited in README.md. Icons are simple filled/stroke approximations of the Starship SVGs. */
	.DetailsCategory-frame { width: 360px; background: var(--recessed); } /* tree sits on DetailsView.GridLine (Recessed): SDetailsView.cpp:430-436 */

	/* Category header row: GridLine border with bottom padding 1 (Classic style: top padding 0): SDetailCategoryTableRow.cpp:139-144, DetailsViewStyle.cpp:241-246 */
	.DetailsCategory-cat { padding-bottom: 1px; background: var(--recessed); }
	.DetailsCategory-catRow { display: flex; align-items: center; min-height: 26px; background: var(--header); cursor: pointer; } /* DetailsView.CategoryTop = Header; MinDesiredHeight 26: StarshipStyle.cpp:3188, SDetailCategoryTableRow.cpp:155, PropertyEditorConstants.h:28 */
	.DetailsCategory-arrow { flex: none; margin-left: 2px; width: 16px; height: 16px; color: color-mix(in srgb, var(--foreground) 60%, transparent); } /* caret 16x16, Foreground tint x SubduedForeground 0.6: StarshipCoreStyle.cpp:2072-2075, SDetailExpanderArrow.cpp:25-31, WidgetStyle.cpp:11 */
	.DetailsCategory-catRow:hover .DetailsCategory-arrow { color: color-mix(in srgb, var(--foreground-hover) 60%, transparent); } /* *_Hovered brush: StarshipCoreStyle.cpp:2073, 2075 */
	.DetailsCategory-title { flex: 1; min-width: 0; margin-left: 4px; font: 700 10.667px/1.172 var(--font-sans); color: var(--foreground-header); } /* SmallBold 8pt, ForegroundHeader: StarshipStyle.cpp:3265-3269, SDetailCategoryTableRow.cpp:88-97 */

	/* Property row: 26px min + 1px GridLine bottom padding: SDetailSingleItemRow.cpp:732-738 */
	.DetailsCategory-row { display: flex; min-height: 27px; padding-bottom: 1px; background: var(--recessed); }
	.DetailsCategory-indent { flex: none; background: var(--panel); } /* 16px per level, paints GetRowBackgroundColor(i): SDetailRowIndent.cpp:33-48, 56-70 */
	.DetailsCategory-name, .DetailsCategory-value, .DetailsCategory-right { background: var(--panel); display: flex; align-items: center; min-width: 0; } /* GetRowBackgroundColor(0): PropertyEditorConstants.cpp:25-57 */
	.DetailsCategory-row.is-hover .DetailsCategory-name, .DetailsCategory-row.is-hover .DetailsCategory-value, .DetailsCategory-row.is-hover .DetailsCategory-right,
	.DetailsCategory-row:hover .DetailsCategory-name, .DetailsCategory-row:hover .DetailsCategory-value, .DetailsCategory-row:hover .DetailsCategory-right { background: var(--header); } /* hovered: Colors.Header: PropertyEditorConstants.cpp:45-47 */
	.DetailsCategory-row.is-nested .DetailsCategory-name, .DetailsCategory-row.is-nested .DetailsCategory-value { background: #282828; } /* level 1: Panel #242424 + 4 per channel: PropertyEditorConstants.cpp:40-54 */
	.DetailsCategory-row.is-nested:hover .DetailsCategory-name, .DetailsCategory-row.is-nested:hover .DetailsCategory-value { background: #333333; } /* Header #2f2f2f + 4 */
	.DetailsCategory-name { flex: 0 0 40%; font: 400 10.667px/1.172 var(--font-sans); color: var(--foreground); } /* NormalFont 8pt: StarshipStyle.cpp:3122; Name 40%, Value 60%: DetailsViewArgs.h:134 */
	.DetailsCategory-row.is-nested .DetailsCategory-name { flex-basis: calc(40% - 16px); } /* the indent comes out of the Name column */
	.DetailsCategory-nameInner { display: flex; align-items: center; min-width: 0; }
	.DetailsCategory-rowArrow { margin-left: 2px; width: 16px; height: 16px; flex: none; color: color-mix(in srgb, var(--foreground) 60%, transparent); visibility: hidden; } /* slot padding 2, 16px caret, Hidden when no children: SDetailSingleItemRow.cpp:503-510, SDetailExpanderArrow.cpp:36-44 */
	.DetailsCategory-rowArrow.has-children { visibility: visible; }
	.DetailsCategory-label { margin-left: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } /* name slot Padding(2,0,0,0): SDetailSingleItemRow.cpp:523-531 */
	.DetailsCategory-value { flex: 1; padding: 0 2px 0 12px; } /* RightRowPadding (12,0,2,0): SDetailSingleItemRow.cpp:39, 553 */
	.DetailsCategory-right { flex: 0 0 22px; justify-content: flex-end; } /* RightColumnMinWidth 22: DetailsViewArgs.h:135 */
	.DetailsCategory-split { flex: 0 0 1px; background: var(--recessed); } /* DetailsView.Splitter, 1px handle: SDetailSingleItemRow.cpp:426-428, StarshipStyle.cpp:3246-3249 */

	/* Value widgets: NormalEditableTextBox (padding 8,3,8,4), Checkbox (18px), ComboButton: StarshipCoreStyle.cpp:1282-1294, 1577-1599, 1470-1494 */
	.DetailsCategory-text { flex: 1; min-width: 0; padding: 3px 8px 4px; border-radius: 4px; background: var(--input); box-shadow: inset 0 0 0 1px var(--input-outline); color: var(--foreground); font: 400 10.667px/1.172 var(--font-sans); white-space: nowrap; overflow: hidden; }
	.DetailsCategory-text:hover { box-shadow: inset 0 0 0 1px var(--hover); }
	.DetailsCategory-check { width: 18px; height: 18px; flex: none; border-radius: 3px; background: var(--input); box-shadow: inset 0 0 0 1px var(--secondary); color: var(--primary); display: inline-flex; align-items: center; justify-content: center; } /* CheckboxCornerRadius 3, outline Secondary: StarshipCoreStyle.cpp:1574, 1597 */
	.DetailsCategory-check:hover { box-shadow: inset 0 0 0 1px var(--hover); }
	.DetailsCategory-check svg { width: 16px; height: 16px; }
	.DetailsCategory-combo { flex: 1; min-width: 0; display: flex; align-items: center; height: 22px; padding: 1px 8px; border-radius: 4px; background: var(--input); box-shadow: inset 0 0 0 1px var(--input-outline); color: var(--foreground); font: 400 10.667px/1.172 var(--font-sans); }
	.DetailsCategory-combo:hover { box-shadow: inset 0 0 0 1px var(--hover); color: var(--foreground-hover); }
	.DetailsCategory-combo .label { flex: 1; }
	.DetailsCategory-combo svg { width: 16px; height: 16px; margin: 2px; flex: none; }
	.DetailsCategory-reset { width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; color: var(--foreground); } /* StarshipStyle.cpp:3277-3283 */
	.DetailsCategory-reset svg { width: 16px; height: 16px; }

	/* "Advanced" dropdown row: Panel row, regular-weight Small label, MinHeight 26: DetailAdvancedDropdownNode.cpp:74-111 */
	.DetailsCategory-adv { padding-bottom: 1px; background: var(--recessed); }
	.DetailsCategory-advRow { display: flex; align-items: center; min-height: 26px; background: var(--panel); cursor: pointer; }
	.DetailsCategory-advRow:hover { background: var(--header); }
	.DetailsCategory-advRow .DetailsCategory-title { font-weight: 400; } /* Font(PropertyFontStyle) wins over the SmallBold TextStyle font: DetailAdvancedDropdownNode.cpp:85-86 */
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
	<symbol id="DetailsCategory-down" viewBox="0 0 16 16"><path d="M4.5 6h7L8 10.5z" fill="currentColor"/></symbol>
	<symbol id="DetailsCategory-right" viewBox="0 0 16 16"><path d="M6 4.5v7L10.5 8z" fill="currentColor"/></symbol>
	<symbol id="DetailsCategory-chev" viewBox="0 0 16 16"><path d="m4.5 6.5 3.5 3.5 3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
	<symbol id="DetailsCategory-tick" viewBox="0 0 16 16"><path d="m3.75 8.5 3 3 5.5-6.5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></symbol>
	<symbol id="DetailsCategory-reset" viewBox="0 0 16 16"><path d="M5.5 3.5 2.5 6.5l3 3M2.5 6.5h7a3.5 3.5 0 0 1 0 7H7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>
<div class="DetailsCategory-frame">

	<!-- Expanded category -->
	<div class="DetailsCategory-cat">
		<div class="DetailsCategory-catRow"><svg class="DetailsCategory-arrow"><use href="#DetailsCategory-down"/></svg><span class="DetailsCategory-title">Rendering</span></div>
	</div>
	<div class="DetailsCategory-row">
		<div class="DetailsCategory-name"><span class="DetailsCategory-nameInner"><svg class="DetailsCategory-rowArrow"><use href="#DetailsCategory-right"/></svg><span class="DetailsCategory-label">Visible</span></span></div>
		<div class="DetailsCategory-split"></div>
		<div class="DetailsCategory-value"><span class="DetailsCategory-check"><svg><use href="#DetailsCategory-tick"/></svg></span></div>
		<div class="DetailsCategory-split"></div>
		<div class="DetailsCategory-right"></div>
	</div>
	<div class="DetailsCategory-row">
		<div class="DetailsCategory-name"><span class="DetailsCategory-nameInner"><svg class="DetailsCategory-rowArrow"><use href="#DetailsCategory-right"/></svg><span class="DetailsCategory-label">Actor Label</span></span></div>
		<div class="DetailsCategory-split"></div>
		<div class="DetailsCategory-value"><span class="DetailsCategory-text">Chair</span></div>
		<div class="DetailsCategory-split"></div>
		<div class="DetailsCategory-right"><span class="DetailsCategory-reset"><svg><use href="#DetailsCategory-reset"/></svg></span></div>
	</div>
	<div class="DetailsCategory-row is-hover">
		<div class="DetailsCategory-name"><span class="DetailsCategory-nameInner"><svg class="DetailsCategory-rowArrow"><use href="#DetailsCategory-right"/></svg><span class="DetailsCategory-label">Collision Preset</span></span></div>
		<div class="DetailsCategory-split"></div>
		<div class="DetailsCategory-value"><span class="DetailsCategory-combo"><span class="label">BlockAll</span><svg><use href="#DetailsCategory-chev"/></svg></span></div>
		<div class="DetailsCategory-split"></div>
		<div class="DetailsCategory-right"></div>
	</div>
	<div class="DetailsCategory-row">
		<div class="DetailsCategory-name"><span class="DetailsCategory-nameInner"><svg class="DetailsCategory-rowArrow has-children"><use href="#DetailsCategory-down"/></svg><span class="DetailsCategory-label">Lighting</span></span></div>
		<div class="DetailsCategory-split"></div>
		<div class="DetailsCategory-value"></div>
		<div class="DetailsCategory-split"></div>
		<div class="DetailsCategory-right"></div>
	</div>
	<div class="DetailsCategory-row is-nested">
		<div class="DetailsCategory-indent" style="width: 16px"></div>
		<div class="DetailsCategory-name"><span class="DetailsCategory-nameInner"><svg class="DetailsCategory-rowArrow"><use href="#DetailsCategory-right"/></svg><span class="DetailsCategory-label">Cast Shadow</span></span></div>
		<div class="DetailsCategory-split"></div>
		<div class="DetailsCategory-value"><span class="DetailsCategory-check"><svg><use href="#DetailsCategory-tick"/></svg></span></div>
		<div class="DetailsCategory-split"></div>
		<div class="DetailsCategory-right"></div>
	</div>

	<!-- Collapsed category -->
	<div class="DetailsCategory-cat">
		<div class="DetailsCategory-catRow"><svg class="DetailsCategory-arrow"><use href="#DetailsCategory-right"/></svg><span class="DetailsCategory-title">Static Mesh</span></div>
	</div>

	<!-- Advanced dropdown row -->
	<div class="DetailsCategory-adv">
		<div class="DetailsCategory-advRow"><svg class="DetailsCategory-arrow"><use href="#DetailsCategory-right"/></svg><span class="DetailsCategory-title">Advanced</span></div>
	</div>
</div>
</body>
</html>
