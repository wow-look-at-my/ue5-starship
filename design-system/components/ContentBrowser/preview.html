<!-- @dsCard group="Content Browser" height=260 subtitle="Composed panel: toolbar, source tree, splitter, search bar, folder tiles, item count" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ContentBrowser</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Roboto+Condensed:wght@400;700&family=Roboto+Mono&display=swap">
<style>body { font-family: var(--font-sans); }</style>
<style>
	.ContentBrowser { width: 1200px; margin: 12px 16px; background: var(--background); font: 400 13.333px/16px var(--font-sans); color: var(--foreground); }
	.ContentBrowser svg { width: 16px; height: 16px; flex: none; display: block; }
	.ContentBrowser button { font: inherit; color: inherit; border: 0; background: none; margin: 0; cursor: default; display: flex; align-items: center; }

	/* ===== top row: SContentBrowser.cpp:764-855 (Panel, Padding 3) ===== */
	.ContentBrowser__top { display: flex; align-items: center; background: var(--panel); padding: 3px; }
	.ContentBrowser__tools { display: flex; align-items: center; margin-left: 5px; padding: 2px 0 2px 4px; }
	.ContentBrowser__sep { width: 2px; margin: 0 4px; }
	.ContentBrowser__add { gap: 3px; padding: 3px 14px; height: 22px; border-radius: 4px; background: var(--secondary); box-shadow: inset 0 0 0 1px var(--input); color: var(--foreground-hover); }
	.ContentBrowser__add:hover { background: var(--hover); }
	.ContentBrowser__add svg { color: var(--accent-green); }
	.ContentBrowser__btn { gap: 3px; padding: 3px 4px; border-radius: 4px; }
	.ContentBrowser__btn:hover, .ContentBrowser__nav:hover:not(:disabled), .ContentBrowser__crumb:hover, .ContentBrowser__settings:hover { background: var(--dropdown); color: var(--foreground-hover); }
	.ContentBrowser__nav { padding: 1px 3px; border-radius: 4px; }
	.ContentBrowser__nav--back { margin-left: 10px; }
	.ContentBrowser__nav--fwd { margin-left: 2px; }
	.ContentBrowser__nav:disabled { opacity: .45; }
	.ContentBrowser__path { flex: 1; min-width: 0; display: flex; align-items: center; margin-left: 2px; }
	.ContentBrowser__folder { margin: 0 4px 0 6px; }
	.ContentBrowser__crumb { padding: 3px 4px; border-radius: 4px; }
	.ContentBrowser__delim { padding: 1px 5px; }
	.ContentBrowser__settings { margin-left: 5px; padding: 1px 4px; border-radius: 4px; }
	.ContentBrowser__settings svg, .ContentBrowser__settings span { margin: 0 4px; }

	/* SSeparator Thickness(2), Separator brush = Recessed (SContentBrowser.cpp:861; StarshipCoreStyle.cpp:707) */
	.ContentBrowser__rule { height: 2px; background: var(--recessed); }

	/* ===== body: SSplitter, handle 2px (SContentBrowser.cpp:871); handle = Splitter normal brush Background (StarshipCoreStyle.cpp:633-635) ===== */
	.ContentBrowser__body { display: flex; align-items: stretch; background: var(--background); }
	.ContentBrowser__sources { width: 340px; flex: none; padding: 4px; box-sizing: border-box; }     /* SBox Padding(4) :880 */
	.ContentBrowser__sourcesFrame { display: flex; flex-direction: column; gap: 2px; background: var(--background); } /* vertical splitter handle 2px :897 */
	.ContentBrowser__area { background: var(--header); padding-top: 2px; }                            /* :908-909 */
	.ContentBrowser__head { display: flex; align-items: center; padding: 0 4px; min-height: 24px; }   /* HeaderPadding(4,0) :1473 */
	.ContentBrowser__arrow { margin-right: 3px; }
	.ContentBrowser__title { flex: 1; font-weight: 700; }
	.ContentBrowser__tool { margin: 0 4px; padding: 4px; border-radius: 4px; display: flex; }
	.ContentBrowser__add2 { margin-left: 4px; padding: 1px 3px; border-radius: 4px; display: flex; }
	.ContentBrowser__add2 + .ContentBrowser__tool { margin-left: 4px; }
	.ContentBrowser__tree { background: var(--recessed); }
	.ContentBrowser__row { display: flex; align-items: center; height: 16px; }
	.ContentBrowser__row--root { height: 19px; padding-top: 3px; }
	.ContentBrowser__row--parent { background: var(--select-parent); }
	.ContentBrowser__row--sel { background: var(--select-inactive); color: var(--foreground-hover); }
	.ContentBrowser__exp { width: 16px; height: 16px; flex: none; }
	.ContentBrowser__fi { margin-right: 2px; color: var(--accent-folder); }

	.ContentBrowser__split { width: 2px; background: var(--background); flex: none; }

	/* ===== asset area: Brushes.Panel, Padding(2,2,2,0) (SContentBrowser.cpp:1445-1447) ===== */
	.ContentBrowser__assets { flex: 1; min-width: 0; margin: 0; display: flex; flex-direction: column; background: var(--panel); padding: 2px 2px 0; }
	.ContentBrowser__search { display: flex; align-items: flex-start; padding: 4px 0 4px 6px; }   /* :1362 */
	.ContentBrowser__field { display: flex; align-items: center; width: 500px; max-width: 100%; box-sizing: border-box; border-radius: 999px; background: var(--input); box-shadow: inset 0 0 0 1px var(--secondary); }
	.ContentBrowser__field svg { margin-left: 4px; width: 14px; height: 14px; }
	.ContentBrowser__hint { flex: 1; padding: 3px 30px 4px 8px; opacity: .35; }
	.ContentBrowser__ibtn { display: flex; align-items: center; margin-left: 2px; padding: 1px 2px; border-radius: 4px; height: 18px; align-self: center; }
	.ContentBrowser__ibtn:hover { background: var(--dropdown); color: var(--foreground-hover); }
	.ContentBrowser__ibtn--filter { padding: 1px 3px; } .ContentBrowser__ibtn--filter svg + svg { margin-left: 2px; }
	.ContentBrowser__tiles { display: flex; flex-wrap: wrap; align-content: flex-start; flex: 1; }
	.ContentBrowser__tile { box-sizing: border-box; width: 82px; height: 130px; padding: 0 9px 9px 0; flex: none; }   /* AssetViewWidgets.cpp:2204,2208; SAssetView.cpp:5727 */
	.ContentBrowser__card { width: 73px; height: 121px; border-radius: 4px; }
	.ContentBrowser__thumb { width: 73px; height: 73px; padding: 5px; box-sizing: border-box; }                       /* :173 */
	.ContentBrowser__thumb svg { width: 100%; height: 100%; padding: 0 2px 2px 0; box-sizing: border-box; color: var(--accent-folder); filter: drop-shadow(1.5px 1.5px 1.5px rgba(0,0,0,.55)); }
	.ContentBrowser__label { padding: 3px 2px; }
	.ContentBrowser__label div { padding: 2px 0 0 2px; font: 400 12px/14px var(--font-sans); text-align: center; }    /* 9pt */
	.ContentBrowser__tile.is-sel .ContentBrowser__card { background: var(--secondary); box-shadow: inset 0 0 0 1px var(--primary), 2px 2px 3px rgba(0,0,0,.5); }
	.ContentBrowser__tile.is-sel .ContentBrowser__label div { color: var(--white); }
	/* bottom bar: Text Padding(8,5) (SAssetView.cpp:1383-1387) */
	.ContentBrowser__status { padding: 5px 8px; }

	/* ===== live behaviour (<ue-content-browser>) ===== */
	.ContentBrowser__top { position: relative; }
	.ContentBrowser__body { height: 189px; }
	.ContentBrowser__sources { display: flex; flex-direction: column; overflow: hidden; }
	.ContentBrowser__sourcesFrame { flex: 1; min-height: 0; }
	.ContentBrowser__area { display: flex; flex-direction: column; flex: none; }
	.ContentBrowser__area--fill { flex: 1 1 0; min-height: 0; }
	.ContentBrowser__area--fill.is-collapsed { flex: none; }
	.ContentBrowser__tree { overflow-y: auto; min-height: 0; scrollbar-width: thin; scrollbar-color: var(--hover) transparent; }
	.ContentBrowser__tree[hidden] { display: none; }
	.ContentBrowser__name { white-space: nowrap; }
	.ContentBrowser__title, .ContentBrowser__tool, .ContentBrowser__row, .ContentBrowser__tile { user-select: none; }
	.ContentBrowser__tiles { overflow-y: auto; overflow-x: hidden; min-height: 0; scrollbar-width: thin; scrollbar-color: var(--hover) transparent; }

	/* Pressed: SimpleButton Dropdown r4 and the content shifts 1px down (StarshipCoreStyle.cpp:1389-1407); Add is a Button with Header fill (:1374, CoreStyle.h:112) */
	.ContentBrowser__btn:active, .ContentBrowser__nav:active:not(:disabled), .ContentBrowser__crumb:active, .ContentBrowser__settings:active, .ContentBrowser__ibtn:active, .ContentBrowser__tool:active, .ContentBrowser__add2:active,
	.ContentBrowser__btn:focus-visible, .ContentBrowser__nav:focus-visible:not(:disabled), .ContentBrowser__crumb:focus-visible, .ContentBrowser__settings:focus-visible, .ContentBrowser__ibtn:focus-visible, .ContentBrowser__tool:focus-visible { background: var(--dropdown); color: var(--foreground-hover); outline: 0; }
	.ContentBrowser__btn:active { padding: 4px 4px 2px; }
	.ContentBrowser__nav:active:not(:disabled) { padding: 2px 3px 0; }
	.ContentBrowser__crumb:active { padding: 4px 4px 2px; }
	.ContentBrowser__settings:active { padding: 2px 4px 0; }
	.ContentBrowser__add:active { background: var(--header); padding: 4px 14px 2px; }
	.ContentBrowser__add:focus-visible { background: var(--hover); outline: 0; }

	/* source tree: SelectHover on hover; the selected row is SelectInactive until the sources column has focus, then Select (StarshipCoreStyle.cpp:2002-2012) */
	.ContentBrowser__row:hover { background: var(--select-hover); }
	.ContentBrowser__row--sel, .ContentBrowser__row--sel:hover { background: var(--select-inactive); color: var(--foreground-hover); }
	.ContentBrowser__sources:focus-within .ContentBrowser__row--sel, .ContentBrowser__sources:focus-within .ContentBrowser__row--sel:hover { background: var(--select); }
	/* keyboard focus selector: SelectorFocusedBrush 1px, SelectorColor linear (0.701, 0.225, 0.003) = #da820a (StarshipCoreStyle.cpp:62,2007) */
	.ContentBrowser__row:focus-visible, .ContentBrowser__title:focus-visible, .ContentBrowser__tool:focus-visible { outline: 1px solid #da820a; outline-offset: -1px; }
	.ContentBrowser__tool:hover, .ContentBrowser__add2:hover { background: var(--dropdown); color: var(--foreground-hover); }
	.ContentBrowser__tool[aria-pressed="true"] { background: var(--primary); color: var(--foreground-hover); }
	.ContentBrowser__tool[aria-pressed="true"]:hover { background: var(--primary-hover); }
	.ContentBrowser__tool[aria-pressed="true"]:active { background: var(--dropdown); }

	/* splitter handle: Secondary while hovered or dragged (StarshipCoreStyle.cpp:635) */
	.ContentBrowser__split { position: relative; cursor: col-resize; touch-action: none; outline: 0; }
	.ContentBrowser__split::before { content: ""; position: absolute; top: 0; bottom: 0; left: -3px; right: -3px; }
	.ContentBrowser__split:hover, .ContentBrowser__split.is-dragging, .ContentBrowser__split:focus-visible { background: var(--secondary); }

	/* search field: hover outline Hover, focus outline Primary, focused text White (StarshipCoreStyle.cpp:1283-1306) */
	.ContentBrowser__field { position: relative; }
	.ContentBrowser__field:hover { box-shadow: inset 0 0 0 1px var(--hover); }
	.ContentBrowser__field:focus-within { box-shadow: inset 0 0 0 1px var(--primary); }
	.ContentBrowser__input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--foreground); font: inherit; padding: 3px 30px 4px 8px; }
	.ContentBrowser__input::placeholder { color: var(--foreground); opacity: .35; }
	.ContentBrowser__input:focus { color: var(--white); }
	.ContentBrowser__clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); padding: 0 0 0 4px; border-radius: 4px; }
	.ContentBrowser__clear[hidden] { display: none; }
	.ContentBrowser__field .ContentBrowser__clear svg { margin: 0; width: 16px; height: 16px; }
	.ContentBrowser__clear:hover, .ContentBrowser__clear:active, .ContentBrowser__clear:focus-visible { background: var(--dropdown); color: var(--foreground-hover); outline: 0; }
	.ContentBrowser .ContentBrowser__ibtn { margin-left: 2px; }   /* the button reset above would zero it; the span version kept 2px */
	.ContentBrowser__ibtn:active { padding: 2px 2px 0; }
	.ContentBrowser__ibtn--filter:active { padding: 2px 3px 0; }

	/* folder tiles: hover and selected reproduce AssetTile folder (Secondary r4 + drop shadow; selected outline Primary, selected + hover PrimaryHover) */
	.ContentBrowser__tile { outline: 0; cursor: default; }
	.ContentBrowser__tile:hover .ContentBrowser__card { background: var(--secondary); box-shadow: 2px 2px 3px rgba(0,0,0,.5); }
	.ContentBrowser__tile:hover .ContentBrowser__label div { color: var(--white); }
	.ContentBrowser__tile.is-sel:hover .ContentBrowser__card { box-shadow: inset 0 0 0 1px var(--primary-hover), 2px 2px 3px rgba(0,0,0,.5); }
	.ContentBrowser__tile:focus-visible .ContentBrowser__card { outline: 1px solid #da820a; outline-offset: 1px; }

	/* popup menu: same declarations as PopupMenu/preview.html */
	.ContentBrowser__menu { position: absolute; z-index: 20; box-sizing: border-box; min-width: 200px; padding: 8px 0; background: var(--dropdown); box-shadow: inset 0 0 0 1px var(--dropdown-outline); color: var(--foreground-hover); }
	.ContentBrowser .ContentBrowser__menuitem { width: 100%; padding: 3px 5px 3px 12px; gap: 8px; color: var(--foreground-hover); text-align: left; white-space: nowrap; border-radius: 0; }
	.ContentBrowser .ContentBrowser__menuitem:hover, .ContentBrowser .ContentBrowser__menuitem:focus { background: var(--primary); outline: 0; }
	.ContentBrowser__menucheck { display: flex; width: 16px; height: 16px; margin-left: 2px; flex: none; }
	.ContentBrowser__menusep { height: 1px; margin: 6px 12px; background: var(--white-25); }
</style>
</head>
