<!-- @dsCard group="Controls" height=200 subtitle="Slider with 8px round thumb on a 4px bar: normal, hovered, disabled, at 0, 50 and 100 percent" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slider</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Roboto+Condensed:wght@400;700&family=Roboto+Mono&display=swap">
<style>body { font-family: var(--font-sans); }</style>
<style>
	/* Slate unit = 1px. Shown on --panel, the usual tool panel fill. */
	.slider-page { padding: 16px; }
	.slider-panel { background: var(--panel); padding: 16px; display: grid; grid-template-columns: 110px 230px 230px; gap: 16px 24px; align-items: center; }
	.slider-name, .slider-head { font: 400 10.667px/1.2 var(--font-sans); color: var(--foreground); opacity: .7; }
	.slider-panel--live { grid-template-columns: 110px 230px 90px; margin-bottom: 12px; }
	.slider-panel--live > .slider-head { grid-column: 1 / -1; }
	.slider-value { font: 400 10.667px/1.2 var(--font-sans); color: var(--foreground-hover); }
</style>
</head>
<body>
<div class="slider-page">
	<div class="slider-panel slider-panel--live">
		<span class="slider-head">Live: drag the thumb or click the bar. Arrow keys step, Page Up and Page Down jump, Home and End go to the ends.</span>

		<span class="slider-name">0 to 1, step 0.01</span>
		<ue-slider>
			<div class="slider" role="slider" tabindex="0" aria-label="Opacity" data-min="0" data-max="1" data-step="0.01" data-value="0.5" style="--slider-value:.5"><span class="slider__bar"></span><span class="slider__thumb"></span></div>
			<ue-event-status class="slider-value" event="ue-slider-change" template="{text}">0.50</ue-event-status>
		</ue-slider>

		<span class="slider-name">0 to 100, step 5</span>
		<ue-slider>
			<div class="slider" role="slider" tabindex="0" aria-label="Volume" data-min="0" data-max="100" data-step="5" data-value="25" style="--slider-value:.25"><span class="slider__bar"></span><span class="slider__thumb"></span></div>
			<ue-event-status class="slider-value" event="ue-slider-change" template="{text}">25</ue-event-status>
		</ue-slider>

		<span class="slider-name">Disabled</span>
		<ue-slider>
			<div class="slider" role="slider" aria-disabled="true" aria-label="Locked" data-min="0" data-max="1" data-step="0.01" data-value="0.5" style="--slider-value:.5"><span class="slider__bar"></span><span class="slider__thumb"></span></div>
			<ue-event-status class="slider-value" event="ue-slider-change" template="{text}">0.50</ue-event-status>
		</ue-slider>
	</div>
	<div class="slider-panel">
		<span></span><span class="slider-head">Normal</span><span class="slider-head">Hovered</span>

		<span class="slider-name">0%</span>
		<ue-slider data-pinned><div class="slider" style="--slider-value:0"><span class="slider__bar"></span><span class="slider__thumb"></span></div></ue-slider>
		<ue-slider data-pinned><div class="slider slider--hover" style="--slider-value:0"><span class="slider__bar"></span><span class="slider__thumb"></span></div></ue-slider>

		<span class="slider-name">50%</span>
		<ue-slider data-pinned><div class="slider" style="--slider-value:.5"><span class="slider__bar"></span><span class="slider__thumb"></span></div></ue-slider>
		<ue-slider data-pinned><div class="slider slider--hover" style="--slider-value:.5"><span class="slider__bar"></span><span class="slider__thumb"></span></div></ue-slider>

		<span class="slider-name">100%</span>
		<ue-slider data-pinned><div class="slider" style="--slider-value:1"><span class="slider__bar"></span><span class="slider__thumb"></span></div></ue-slider>
		<ue-slider data-pinned><div class="slider slider--hover" style="--slider-value:1"><span class="slider__bar"></span><span class="slider__thumb"></span></div></ue-slider>

		<span class="slider-name">Disabled, 50%</span>
		<ue-slider data-pinned><div class="slider slider--disabled" style="--slider-value:.5"><span class="slider__bar"></span><span class="slider__thumb"></span></div></ue-slider>
		<span></span>
	</div>
</div>
</body>
</html>
