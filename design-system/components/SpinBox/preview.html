<!-- @dsCard group="Controls" height=190 subtitle="SpinBox with fill bar: normal, hovered, dragging, text entry, unbounded, disabled, and the axis-strip numeric entry" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpinBox</title>
<style>
	/* Slate unit = 1px. Outline is drawn inside the box (inset shadow). */
	.spinbox-page { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
	.spinbox-row { display: flex; flex-wrap: wrap; gap: 12px 16px; }
	.spinbox-item { display: flex; flex-direction: column; gap: 4px; width: 132px; }
	.spinbox-cap { font: 400 10.667px/1.2 var(--font-sans); color: var(--foreground); opacity: .7; }

	.spinbox {
		--spinbox-fill: .4; /* fraction of the range */
		position: relative; box-sizing: border-box; width: 100%;
		padding: 1px 2px; /* SSpinBox ContentPadding (2,1) SSpinBox.h:92 */
		border-radius: 4px; /* InputFocusRadius CoreStyle.h:117 */
		background: var(--input); /* StarshipCoreStyle.cpp:598 */
		box-shadow: inset 0 0 0 1px var(--input-outline); /* :598, thickness CoreStyle.h:118 */
		color: var(--foreground-hover); /* ForegroundColor :605 */
		font: 400 13.333px/16px var(--font-sans); /* NormalFont SSpinBox.h:91 */
		cursor: ew-resize; user-select: none;
	}
	.spinbox__fill {
		position: absolute; left: 1px; top: 1px; bottom: 1px; /* InsetPadding 1 :607, SSpinBox.h:401 */
		width: calc(var(--spinbox-fill) * 100% - 2px); /* fill = fraction x width minus inset SSpinBox.h:394-401 */
		border-radius: 4px; /* :601-603 */
		background: var(--dropdown); /* InactiveFillBrush :603 */
	}
	.spinbox__text { position: relative; padding: 2.5px 7px; white-space: nowrap; } /* TextPadding (7,2.5,7,2.5) :606 */
	.spinbox:hover, .spinbox--hover { box-shadow: inset 0 0 0 1px var(--hover); } /* :599 */
	.spinbox:hover .spinbox__fill, .spinbox--hover .spinbox__fill { background: var(--hover); } /* HoveredFillBrush :602 */
	.spinbox--active, .spinbox--active:hover { box-shadow: inset 0 0 0 1px var(--primary); cursor: ew-resize; } /* ActiveBackgroundBrush :600 */
	.spinbox--active .spinbox__fill, .spinbox--active:hover .spinbox__fill { background: var(--primary); } /* ActiveFillBrush :601 */
	.spinbox--text, .spinbox--text:hover { box-shadow: inset 0 0 0 1px var(--primary); cursor: text; } /* text mode counts as active, fill hidden SSpinBox.h:343, 396 */
	.spinbox--text .spinbox__fill { display: none; }
	.spinbox--unbounded .spinbox__fill { display: none; } /* no fill without a slider range SSpinBox.h:370 */
	.spinbox--disabled, .spinbox--disabled:hover { opacity: .45; box-shadow: inset 0 0 0 1px var(--input-outline); } /* alpha x .45 SlateElementPixelShader.usf:535 */
	.spinbox--disabled:hover .spinbox__fill { background: var(--dropdown); }
	.spinbox__caret { display: inline-block; width: 1.28px; height: 16px; vertical-align: top; background: var(--white); } /* TextEditHelper.h:18 */

	.spinbox__axis { position: absolute; left: 3px; top: 3px; bottom: 3px; width: 2px; z-index: 2; } /* LabelPadding 3, strip 2px SNumericEntryBox.h:451-456, SVectorInputBox.h:454 */
	.spinbox__axis--x { background: #cb2600; } /* Red label (0.594,0.0197,0) linear -> sRGB, SNumericEntryBox.h:813 */
	.spinbox__axis--y { background: #67a900; } /* Green (0.1349,0.3959,0) :816 */
	.spinbox__axis--z { background: #2c7eed; } /* Blue (0.0251,0.207,0.85) :819 */
	.spinbox--axis .spinbox__text { padding-left: 7px; }
</style>
</head>
<body>
<div class="spinbox-page">
	<div class="spinbox-row">
		<div class="spinbox-item"><div class="spinbox"><span class="spinbox__fill"></span><span class="spinbox__text">0.4</span></div><span class="spinbox-cap">Normal</span></div>
		<div class="spinbox-item"><div class="spinbox spinbox--hover"><span class="spinbox__fill"></span><span class="spinbox__text">0.4</span></div><span class="spinbox-cap">Hovered</span></div>
		<div class="spinbox-item"><div class="spinbox spinbox--active"><span class="spinbox__fill"></span><span class="spinbox__text">0.4</span></div><span class="spinbox-cap">Dragging</span></div>
		<div class="spinbox-item"><div class="spinbox spinbox--text"><span class="spinbox__fill"></span><span class="spinbox__text">0.4<span class="spinbox__caret"></span></span></div><span class="spinbox-cap">Text entry</span></div>
		<div class="spinbox-item"><div class="spinbox spinbox--unbounded"><span class="spinbox__fill"></span><span class="spinbox__text">1200.0</span></div><span class="spinbox-cap">No range, no fill</span></div>
		<div class="spinbox-item"><div class="spinbox spinbox--disabled"><span class="spinbox__fill"></span><span class="spinbox__text">0.4</span></div><span class="spinbox-cap">Disabled</span></div>
	</div>
	<div class="spinbox-row">
		<div class="spinbox-item" style="width:96px"><div class="spinbox spinbox--unbounded spinbox--axis"><span class="spinbox__axis spinbox__axis--x"></span><span class="spinbox__text">-210.0</span></div><span class="spinbox-cap">Vector X</span></div>
		<div class="spinbox-item" style="width:96px"><div class="spinbox spinbox--unbounded spinbox--axis"><span class="spinbox__axis spinbox__axis--y"></span><span class="spinbox__text">-120.0</span></div><span class="spinbox-cap">Vector Y</span></div>
		<div class="spinbox-item" style="width:96px"><div class="spinbox spinbox--unbounded spinbox--axis spinbox--hover"><span class="spinbox__axis spinbox__axis--z"></span><span class="spinbox__text">32.0</span></div><span class="spinbox-cap">Vector Z, hovered</span></div>
	</div>
</div>
</body>
</html>
