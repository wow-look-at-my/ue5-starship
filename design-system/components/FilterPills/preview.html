<!-- @dsCard group="Details" height=76 subtitle="Section tab strip: wrapping toggle pills with the active All pill in Primary" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FilterPills</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Roboto+Condensed:wght@400;700&family=Roboto+Mono&display=swap">
<style>body { font-family: var(--font-sans); }</style>
<style>
	/* Every metric below is cited in README.md. */
	.FilterPills-frame { width: 360px; background: var(--panel); padding-bottom: 8px; } /* Brushes.Panel: SDetailsView.cpp:391-395 */
	.FilterPills-strip {
		display: flex; flex-wrap: wrap; gap: 4px; /* SWrapBox InnerSlotPadding(4,4): SDetailsView.cpp:379 */
		padding: 2px 8px 7px; /* Padding(8,2,8,7): SDetailsView.cpp:374 */
	}
	.FilterPills-pill {
		display: inline-flex; align-items: center; justify-content: center;
		margin: 0; border: 0; cursor: pointer;
		padding: 4px 16px; /* FMargin(16,4): StarshipStyle.cpp:3252 via StarshipCoreStyle.cpp:929 */
		border-radius: 4px;
		background: var(--header); box-shadow: inset 0 0 0 1px var(--input); /* unchecked: StarshipCoreStyle.cpp:923 */
		color: var(--foreground); /* ToggleButtonCheckbox foreground: StarshipCoreStyle.cpp:1633 */
		font: 400 10.667px/1.172 var(--font-sans); /* "SmallText" = Small 8pt: SDetailsView.cpp:1371, StarshipCoreStyle.cpp:1215 */
	}
	.FilterPills-pill:hover, .FilterPills-pill:active, .FilterPills-pill.is-hover, .FilterPills-pill.is-pressed { background: var(--hover); color: var(--foreground-hover); } /* StarshipCoreStyle.cpp:924-925, 1634-1635 */
	.FilterPills-pill.is-checked { background: var(--primary); color: var(--foreground-hover); } /* StarshipCoreStyle.cpp:926, 1636 */
	.FilterPills-pill.is-checked:hover, .FilterPills-pill.is-checked:active, .FilterPills-pill.is-checked.is-hover, .FilterPills-pill.is-checked.is-pressed { background: var(--primary-hover); } /* StarshipCoreStyle.cpp:927-928 */
	.FilterPills-pill:focus-visible { outline: 1px solid var(--primary-hover); outline-offset: 1px; } /* browser keyboard ring: Slate draws none */
	.FilterPills-pill:disabled { opacity: .45; cursor: default; } /* alpha x .45: SlateElementPixelShader.usf:535 */
	/* Preview captions only */
	.FilterPills-cap { width: 360px; box-sizing: border-box; margin: 0; padding: 6px 8px 12px; font: 400 10.667px/1.4 var(--font-sans); color: var(--foreground); opacity: .8; }
	.FilterPills-cap b { color: var(--foreground-hover); }
</style>
</head>
<body>
<ue-filter-pills>
<div class="FilterPills-frame">
	<div class="FilterPills-strip" role="tablist">
		<button class="FilterPills-pill" role="tab" aria-selected="false" tabindex="-1">General</button>
		<button class="FilterPills-pill" role="tab" aria-selected="false" tabindex="-1">Actor</button>
		<button class="FilterPills-pill" role="tab" aria-selected="false" tabindex="-1">LOD</button>
		<button class="FilterPills-pill" role="tab" aria-selected="false" tabindex="-1">Misc</button>
		<button class="FilterPills-pill" role="tab" aria-selected="false" tabindex="-1">Physics</button>
		<button class="FilterPills-pill" role="tab" aria-selected="false" tabindex="-1">Rendering</button>
		<button class="FilterPills-pill" role="tab" aria-selected="false" tabindex="-1">Streaming</button>
		<button class="FilterPills-pill is-checked" role="tab" aria-selected="true" tabindex="0">All</button>
	</div>
</div>
</ue-filter-pills>
<p class="FilterPills-cap"><b>Live.</b> Hover and press a pill, click one to make it the only active pill, or Tab in and use Left, Right, Home and End.</p>

<div class="FilterPills-frame">
	<div class="FilterPills-strip">
		<span class="FilterPills-pill is-hover">Hover</span>
		<span class="FilterPills-pill is-pressed">Pressed</span>
		<span class="FilterPills-pill is-checked">Checked</span>
		<span class="FilterPills-pill is-checked is-hover">Checked hover</span>
	</div>
</div>
<p class="FilterPills-cap"><b>Pinned.</b> Forced states: hovered, pressed, checked, checked and hovered.</p>

</body>
</html>
