<!-- @dsCard group="Details" height=76 subtitle="Section tab strip: wrapping toggle pills with the active All pill in Primary" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FilterPills</title>
<style>
	/* Every metric below is cited in README.md. */
	.FilterPills-frame { width: 360px; background: var(--panel); padding-bottom: 8px; } /* Brushes.Panel: SDetailsView.cpp:391-395 */
	.FilterPills-strip {
		display: flex; flex-wrap: wrap; gap: 4px; /* SWrapBox InnerSlotPadding(4,4): SDetailsView.cpp:379 */
		padding: 2px 8px 7px; /* Padding(8,2,8,7): SDetailsView.cpp:374 */
	}
	.FilterPills-pill {
		display: inline-flex; align-items: center; justify-content: center;
		margin: 0; border: 0; cursor: pointer;
		padding: 4px 16px; /* FMargin(16,4): StarshipStyle.cpp:3252 via StarshipCoreStyle.cpp:929 */
		border-radius: 4px;
		background: var(--header); box-shadow: inset 0 0 0 1px var(--input); /* unchecked: StarshipCoreStyle.cpp:923 */
		color: var(--foreground); /* ToggleButtonCheckbox foreground: StarshipCoreStyle.cpp:1633 */
		font: 400 10.667px/1.172 var(--font-sans); /* "SmallText" = Small 8pt: SDetailsView.cpp:1371, StarshipCoreStyle.cpp:1215 */
	}
	.FilterPills-pill:hover, .FilterPills-pill:active { background: var(--hover); color: var(--foreground-hover); } /* StarshipCoreStyle.cpp:924-925, 1634-1635 */
	.FilterPills-pill.is-checked { background: var(--primary); color: var(--foreground-hover); } /* StarshipCoreStyle.cpp:926, 1636 */
	.FilterPills-pill.is-checked:hover, .FilterPills-pill.is-checked:active { background: var(--primary-hover); } /* StarshipCoreStyle.cpp:927-928 */
</style>
</head>
<body>
<div class="FilterPills-frame">
	<div class="FilterPills-strip" role="tablist">
		<button class="FilterPills-pill" role="tab" aria-selected="false">General</button>
		<button class="FilterPills-pill" role="tab" aria-selected="false">Actor</button>
		<button class="FilterPills-pill" role="tab" aria-selected="false">LOD</button>
		<button class="FilterPills-pill" role="tab" aria-selected="false">Misc</button>
		<button class="FilterPills-pill" role="tab" aria-selected="false">Physics</button>
		<button class="FilterPills-pill" role="tab" aria-selected="false">Rendering</button>
		<button class="FilterPills-pill" role="tab" aria-selected="false">Streaming</button>
		<button class="FilterPills-pill is-checked" role="tab" aria-selected="true">All</button>
	</div>
</div>
</body>
</html>
