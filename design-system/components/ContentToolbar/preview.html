<!-- @dsCard group="Content Browser" height=110 subtitle="Add / Import / Save All, history arrows, breadcrumb trail, Settings" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ContentToolbar</title>
<style>
	/* SContentBrowser.cpp:764-767 SBorder Padding(3), Brushes.Panel */
	.ContentToolbar { display: flex; align-items: center; background: var(--panel); padding: 3px; font: 400 13.333px/16px var(--font-sans); color: var(--foreground); }
	.ContentToolbar svg { width: 16px; height: 16px; flex: none; display: block; }
	.ContentToolbar button { font: inherit; color: inherit; border: 0; background: none; margin: 0; cursor: default; display: flex; align-items: center; }

	/* SContentBrowser.cpp:772 slot Padding(5,0,0,0); StarshipStyle.cpp:6624 ToolBar BackgroundPadding(4,2,0,2) */
	.ContentToolbar__tools { display: flex; align-items: center; margin-left: 5px; padding: 2px 0 2px 4px; }

	/* StarshipStyle.cpp:6622-6623 separator: no brush, padding (4,0); SeparatorThickness 2 (ToolBarStyle.cpp:25) */
	.ContentToolbar__sep { width: 2px; margin: 0 4px; }

	/* Add: SPositiveActionButton -> "Button" style (StarshipCoreStyle.cpp:1372) + content padding (2, 1.5) = padding (14, 3), height 22 (ToolWidgetsStylePrivate.h DefaultButtonHeight) */
	.ContentToolbar__add { gap: 3px; padding: 3px 14px; height: 22px; border-radius: 4px; background: var(--secondary); box-shadow: inset 0 0 0 1px var(--input); color: var(--foreground-hover); }
	.ContentToolbar__add:hover { background: var(--hover); }
	.ContentToolbar__add svg { color: var(--accent-green); } /* ToolWidgetsStyle.cpp:76 AccentGreen plus icon */

	/* Import / Save All: SButton "SimpleButton" (StarshipCoreStyle.cpp:1405) ContentPadding(2) + padding (2,1) = (4,3); icon/label gap 3 (SContentBrowser.cpp:1857) */
	.ContentToolbar__btn { gap: 3px; padding: 3px 4px; border-radius: 4px; }
	.ContentToolbar__btn:hover { background: var(--dropdown); color: var(--foreground-hover); }

	/* history arrows: SimpleButton, ContentPadding(1,0) + (2,1) = (3,1); SContentBrowser.cpp:778-812 */
	.ContentToolbar__nav { padding: 1px 3px; border-radius: 4px; }
	.ContentToolbar__nav:hover:not(:disabled) { background: var(--dropdown); color: var(--foreground-hover); }
	.ContentToolbar__nav--back { margin-left: 10px; }   /* SContentBrowser.cpp:778 */
	.ContentToolbar__nav--fwd { margin-left: 2px; }      /* SContentBrowser.cpp:797 */
	.ContentToolbar__nav:disabled { opacity: .45; }      /* approximation of Slate DisabledEffect (SlateElementPixelShader.usf:514) */

	/* path slot: SContentBrowser.cpp:816-820 Padding(2,0,0,0), fill */
	.ContentToolbar__path { flex: 1; min-width: 0; display: flex; align-items: center; margin-left: 2px; }
	.ContentToolbar__folder { color: var(--foreground); margin: 0 4px 0 6px; }  /* leading folder glyph: in reference image only, not in 5.5.3 source */
	/* crumb: SNavigationBar.h:43-45 SimpleButton + ContentPadding(2,2) => (4,3) */
	.ContentToolbar__crumb { padding: 3px 4px; border-radius: 4px; }
	.ContentToolbar__crumb:hover { background: var(--dropdown); color: var(--foreground-hover); }
	/* delimiter: SBreadcrumbTrail.h:198 ContentPadding(3,0) + (2,1) = (5,1), Icons.ChevronRight 16 (SNavigationBar.h:46) */
	.ContentToolbar__delim { padding: 1px 5px; border-radius: 4px; }

	/* Settings: SComboButton SimpleComboButton, no arrow (SContentBrowser.cpp:497); button padding (4,1) from SimpleButtonLabelAndIcon (StarshipCoreStyle.cpp:1398-1400); icon and label slots Padding(4,0) (SContentBrowser.cpp:504,513); slot Padding(5,0,0,0) (SContentBrowser.cpp:848) */
	.ContentToolbar__settings { margin-left: 5px; padding: 1px 4px; border-radius: 4px; }
	.ContentToolbar__settings:hover { background: var(--dropdown); color: var(--foreground-hover); }
	.ContentToolbar__settings svg { margin: 0 4px; }
	.ContentToolbar__settings span { margin: 0 4px; }

	.demo { padding: 12px 16px; display: grid; gap: 12px; }
	.demo small { color: var(--hover-2); font: 400 10.667px/1 var(--font-sans); display: block; margin-bottom: 4px; }
</style>
</head>
<body>
<div class="demo">
	<div>
		<small>Default (history: back enabled, forward disabled)</small>
		<div class="ContentToolbar">
			<div class="ContentToolbar__tools">
				<button class="ContentToolbar__add">
					<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square"><path d="M8 2.5v11M2.5 8h11"/></svg>
					<span>Add</span>
				</button>
				<span class="ContentToolbar__sep"></span>
				<button class="ContentToolbar__btn">
					<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"><path d="M2 9v5h12V9"/><path d="M8 1.5v8M5 6.5l3 3 3-3"/><path d="M2 9V6.5h2"/></svg>
					<span>Import</span>
				</button>
				<span class="ContentToolbar__sep"></span>
				<button class="ContentToolbar__btn">
					<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 1h8l3 3v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zm1 1v4h6V2zm1 9v3h5v-3z"/><path d="M1 4h1.5v10H1z" opacity=".6"/></svg>
					<span>Save All</span>
				</button>
			</div>
			<button class="ContentToolbar__nav ContentToolbar__nav--back" aria-label="Back">
				<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.5"/><path d="M11.5 8h-7M7.5 5l-3 3 3 3"/></svg>
			</button>
			<button class="ContentToolbar__nav ContentToolbar__nav--fwd" aria-label="Forward" disabled>
				<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.5"/><path d="M4.5 8h7M8.5 5l3 3-3 3"/></svg>
			</button>
			<div class="ContentToolbar__path">
				<svg class="ContentToolbar__folder" viewBox="0 0 16 16" fill="currentColor"><path d="M1 3.5A1.5 1.5 0 0 1 2.5 2H6l1.5 1.5H13.5A1.5 1.5 0 0 1 15 5v7.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 1 12.5z"/></svg>
				<button class="ContentToolbar__crumb">All</button>
				<span class="ContentToolbar__delim"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5L10.5 8 6 12.5"/></svg></span>
				<button class="ContentToolbar__crumb">Content</button>
				<span class="ContentToolbar__delim"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5L10.5 8 6 12.5"/></svg></span>
				<button class="ContentToolbar__crumb">StarterContent</button>
				<span class="ContentToolbar__delim"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5L10.5 8 6 12.5"/></svg></span>
			</div>
			<button class="ContentToolbar__settings">
				<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><circle cx="8" cy="8" r="2.25"/><path d="M8 1.5l1.2 1.7 2-.5.6 2 2 .7-.5 2 1.7 1.3-1.7 1.3.5 2-2 .7-.6 2-2-.5L8 14.5l-1.2-1.7-2 .5-.6-2-2-.7.5-2L1.5 8l1.7-1.3-.5-2 2-.7.6-2 2 .5z"/></svg>
				<span>Settings</span>
			</button>
		</div>
	</div>
	<div>
		<small>Narrow: breadcrumb takes the remaining width</small>
		<div class="ContentToolbar" style="width:520px">
			<div class="ContentToolbar__tools">
				<button class="ContentToolbar__add">
					<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square"><path d="M8 2.5v11M2.5 8h11"/></svg>
					<span>Add</span>
				</button>
			</div>
			<button class="ContentToolbar__nav ContentToolbar__nav--back" aria-label="Back"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.5"/><path d="M11.5 8h-7M7.5 5l-3 3 3 3"/></svg></button>
			<button class="ContentToolbar__nav ContentToolbar__nav--fwd" aria-label="Forward"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.5"/><path d="M4.5 8h7M8.5 5l3 3-3 3"/></svg></button>
			<div class="ContentToolbar__path">
				<button class="ContentToolbar__crumb">Game</button>
				<span class="ContentToolbar__delim"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5L10.5 8 6 12.5"/></svg></span>
				<button class="ContentToolbar__crumb">Maps</button>
			</div>
			<button class="ContentToolbar__settings">
				<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><circle cx="8" cy="8" r="2.25"/><path d="M8 1.5l1.2 1.7 2-.5.6 2 2 .7-.5 2 1.7 1.3-1.7 1.3.5 2-2 .7-.6 2-2-.5L8 14.5l-1.2-1.7-2 .5-.6-2-2-.7.5-2L1.5 8l1.7-1.3-.5-2 2-.7.6-2 2 .5z"/></svg>
				<span>Settings</span>
			</button>
		</div>
	</div>
</div>
</body>
</html>
