name: CI

on:
  push:
    branches: ['**']

concurrency:
  group: gha_${{ github.repository }}_${{ github.workflow }}_${{ github.ref != 'refs/heads/master' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  validate-json:
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate the schemas
        uses: wow-look-at-my/json-validator@lkgb
        with:
          files: design-system/tokens.schema.json design-system/design-system.schema.json

      - name: Validate tokens.json
        uses: wow-look-at-my/json-validator@lkgb
        with:
          schema: design-system/tokens.schema.json
          files: design-system/tokens.json

      - name: Validate design-system.json
        uses: wow-look-at-my/json-validator@lkgb
        with:
          schema: design-system/design-system.schema.json
          files: design-system/design-system.json

  typescript:
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # ts0 type-checks, runs the Playwright tests, then compiles design-system/src to design-system/components.
      - uses: wow-look-at-my/ts0@lkgb

      # The committed .js files must match what ts0 just built.
      - run: test -z "$(git status --porcelain -- design-system/components)"
